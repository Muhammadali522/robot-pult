<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070B14">
<title>Пульт робота</title>
<style>
:root {
  --bg: #070B14; --surface: #0F1626; --surface2: #172139; --line: rgba(255,255,255,.14);
  --accent: #19E38C; --amber: #FFB020; --danger: #FF4D5E; --text: #E8EEF9; --muted: #8A99B5;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { user-select: none; -webkit-user-select: none; touch-action: none; }
button { font: inherit; color: inherit; }
svg { display: block; }

/* ---------- раскладка ---------- */
.app { height: 100%; display: grid; grid-template-columns: 11fr 10fr; gap: 18px;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.stickbox { position: relative; min-height: 0; min-width: 0; display: grid; place-items: center; }
#stick { touch-action: none; display: block; }
.panel { min-height: 0; min-width: 0; display: grid; gap: 12px; grid-template-rows: auto minmax(0,1fr) auto auto; }
@media (orientation: portrait) {
  .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 46%) minmax(0, 1fr); gap: 10px; }
}

/* ---------- кнопка с откликом ---------- */
.pad { position: relative; background: var(--surface2); border: 1px solid var(--line); border-radius: 18px; cursor: pointer;
  display: grid; place-items: center; padding: 0; min-width: 0; min-height: 0; touch-action: none;
  transition: transform .09s ease-out, border-color .14s, box-shadow .14s, background .14s; }
.pad:active, .pad.down { transform: scale(.93); }
.pad.on { border-color: var(--c, var(--accent)); border-width: 1px; box-shadow: 0 0 0 1px var(--c, var(--accent)), 0 0 18px color-mix(in srgb, var(--c, var(--accent)) 35%, transparent); }
.pad.down { border-color: var(--c, var(--accent)); box-shadow: 0 0 0 1px var(--c, var(--accent)), 0 0 18px color-mix(in srgb, var(--c, var(--accent)) 35%, transparent); }
.pad .in { display: grid; justify-items: center; gap: 2px; pointer-events: none; }
.cap { font-size: 10px; letter-spacing: 1px; font-weight: 900; color: var(--muted); }
.pad.on .cap { color: var(--c, var(--accent)); }
.pad svg { stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .14s; }
.pad.on svg { stroke: var(--c, var(--accent)); }
.amber { --c: var(--amber); } .danger { --c: var(--danger); }

/* ---------- верхняя строка ---------- */
.top { display: grid; grid-template-columns: 1fr 56px; gap: 8px; height: 46px; }
.chip { border-radius: 14px; }
.chip .row { display: flex; align-items: center; gap: 8px; padding: 0 12px; width: 100%; font-weight: 700; font-size: 14px; pointer-events: none; }
.chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; }
.led { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 8px var(--danger); flex: none; transition: background .3s, box-shadow .3s; }
.led.ok { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.bad svg { stroke: var(--danger) !important; }

/* ---------- середина: мощность + турбо/стоп ---------- */
.mid { display: grid; grid-template-columns: 78px 1fr; gap: 14px; min-height: 0; }
.power { display: grid; grid-template-rows: auto auto minmax(0,1fr); justify-items: center; gap: 4px; min-height: 0; }
.power .big { font-size: 34px; line-height: 1; font-weight: 900; transition: color .2s; }
.power .big.turbo { color: var(--amber); }
.bar { width: 100%; height: 100%; display: grid; grid-template-rows: repeat(9, 1fr); gap: 4px; padding-top: 4px; touch-action: none; cursor: pointer; }
.seg { border-radius: 6px; background: var(--surface2); transition: background .12s, box-shadow .12s; }
.btns { display: grid; grid-template-rows: 3fr 2fr; gap: 12px; min-height: 0; }
.turbo { background: #2A1F0A; } .stop { background: #2A0F14; }
.turbo .t, .stop .t { font-size: 20px; font-weight: 900; letter-spacing: 2px; }
.turbo svg, .stop svg { stroke: none !important; }
.turbo svg { fill: var(--amber); } .stop svg { fill: var(--danger); }
.turbo .t, .turbo .s { color: var(--amber); } .stop .t { color: var(--danger); }
.turbo .s { font-size: 11px; opacity: .7; }
.stop .in { display: flex; align-items: center; gap: 6px; }

/* ---------- лица ---------- */
.faces { display: grid; grid-template-columns: 12fr 10fr 10fr 10fr 10fr 10fr; gap: 6px; height: 58px; }
.faces .pad { border-radius: 16px; }
.faces .cnt { font-size: 10px; font-weight: 800; color: var(--accent); }

/* ---------- уши ---------- */
.ears { display: grid; grid-template-columns: auto 1fr 1fr 64px; gap: 10px; align-items: center; height: 52px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 0 8px 0 14px; }
.ears .lab { font-size: 10px; letter-spacing: 1.4px; font-weight: 800; color: var(--muted); }
.sl { display: grid; grid-template-columns: 14px 1fr; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; color: var(--muted); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; touch-action: pan-x; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--p, 50%), var(--surface2) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface2); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; margin-top: -8px;
  background: radial-gradient(circle at 35% 30%, #7CF5C4, var(--accent)); border: 2px solid rgba(255,255,255,.25); box-shadow: 0 0 12px rgba(25,227,140,.5); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid rgba(255,255,255,.25); }
.ears .pad { height: 40px; border-radius: 12px; }

/* ---------- оверлей без связи ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center;
  background: rgba(7,11,20,.82); backdrop-filter: blur(3px); transition: opacity .35s, visibility .35s; }
.overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
.overlay h2 { font-size: 22px; margin: 10px 0 4px; font-weight: 800; }
.overlay p { color: var(--muted); margin: 0 0 16px; }
.btn { background: var(--accent); color: #04140D; border: 0; border-radius: 14px; padding: 14px 22px; font-weight: 800; font-size: 15px; cursor: pointer;
  display: inline-flex; gap: 8px; align-items: center; transition: transform .09s, box-shadow .2s; box-shadow: 0 6px 24px rgba(25,227,140,.3); touch-action: manipulation; }
.btn:active { transform: scale(.95); }
.btn svg { stroke: #04140D; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.warn { color: var(--amber); font-size: 13px; max-width: 320px; margin: 14px auto 0; }

/* ---------- диагностика ---------- */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; grid-template-rows: auto 1fr; padding: max(10px, env(safe-area-inset-top)) 16px 12px;
  transform: translateY(100%); transition: transform .35s var(--ease); touch-action: pan-y; }
.sheet.open { transform: none; }
.sheet header { display: flex; align-items: center; gap: 10px; height: 44px; }
.sheet h2 { margin: 0; font-size: 20px; font-weight: 800; flex: 1; }
.ib { width: 42px; height: 42px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; padding: 0; touch-action: manipulation; }
.ib svg { stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cols { display: grid; grid-template-columns: 5fr 6fr; gap: 14px; min-height: 0; margin-top: 8px; }
@media (orientation: portrait) { .cols { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }
.rows { display: block; overflow-y: auto; min-height: 0; }
.r { display: flex; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
.r i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-top: 5px; flex: none; }
.r.ok i { background: var(--accent); } .r.bad i { background: var(--danger); } .r.warn i { background: var(--amber); }
.r small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .4px; }
.r b { font-size: 13.5px; }
.r.ok b { color: var(--accent); } .r.bad b { color: var(--danger); } .r.warn b { color: var(--amber); }
.logbox { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 14px; overflow-y: auto; min-height: 0; touch-action: pan-y; user-select: text; -webkit-user-select: text; }
.logbox .ln { display: flex; gap: 8px; padding: 3px 0; font-size: 12.5px; }
.logbox time { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; flex: none; }
.ln.ok { color: var(--accent); } .ln.warn { color: var(--amber); } .ln.error { color: var(--danger); }
.testbtn { width: 100%; margin-bottom: 6px; justify-content: center; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 30px); background: var(--surface2); border: 1px solid var(--line); padding: 8px 16px; border-radius: 12px; opacity: 0; transition: .25s; z-index: 50; font-size: 13px; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="app">
  <div class="stickbox" id="stickbox"><canvas id="stick"></canvas></div>

  <div class="panel">
    <div class="top">
      <button class="pad chip" id="chip" aria-label="Bluetooth">
        <div class="row">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>
          <span class="led" id="led"></span>
          <span class="name" id="chipname">Нет связи — подключить</span>
        </div>
      </button>
      <button class="pad" id="diagbtn" aria-label="Диагностика"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></button>
    </div>

    <div class="mid">
      <div class="power">
        <div class="cap">МОЩНОСТЬ</div>
        <div class="big" id="pnum">7</div>
        <div class="bar" id="bar"></div>
      </div>
      <div class="btns">
        <button class="pad amber turbo" id="turbo" aria-label="Турбо, удерживай">
          <div class="in">
            <svg width="44" height="44" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>
            <div class="t">ТУРБО</div><div class="s">держи для удара</div>
          </div>
        </button>
        <button class="pad danger stop" id="stop" aria-label="Стоп">
          <div class="in">
            <svg width="30" height="30" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
            <div class="t">СТОП</div>
          </div>
        </button>
      </div>
    </div>

    <div class="faces" id="faces"></div>

    <div class="ears">
      <span class="lab">УШКИ</span>
      <label class="sl">Л<input id="earL" type="range" min="0" max="180" value="90"></label>
      <label class="sl">П<input id="earR" type="range" min="0" max="180" value="90"></label>
      <button class="pad on" id="earAuto" aria-label="Ушки сами">
        <div class="in"><span class="cap" id="earCap">АВТО</span></div>
      </button>
    </div>
  </div>
</div>

<div class="overlay" id="offline">
  <div>
    <svg width="52" height="52" viewBox="0 0 24 24" style="margin:0 auto;stroke:var(--danger);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><path d="M7 7l10 10-5 5V2l5 5L7 17"/><path d="M3 3l18 18"/></svg>
    <h2>Нет связи с роботом</h2>
    <p>Включи робота и подключись</p>
    <button class="btn" id="connect">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>Подключить Bluetooth
    </button>
    <div style="margin-top:14px"><button id="connectall" style="background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer">Не вижу робота — показать все устройства</button></div>
    <div class="warn" id="unsupported" hidden></div>
  </div>
</div>

<section class="sheet" id="sheet">
  <header>
    <button class="ib" id="diagback" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>Диагностика</h2>
    <button class="ib" id="copylog" aria-label="Скопировать журнал"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg></button>
    <button class="ib" id="clearlog" aria-label="Очистить журнал"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg></button>
  </header>
  <div class="cols">
    <div class="rows"><button class="btn testbtn" id="testbt"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Проверка Bluetooth</button><div id="rowlist" style="display:grid;gap:6px"></div></div>
    <div class="logbox" id="logbox"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
'use strict';
const SERVICE = 0xFFE0, CHAR = 0xFFE1;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} };

/* ============ журнал ============ */
const logs = [];
let lastProblem = 0;
function log(text, level = 'info') {
  logs.push({ t: new Date(), text, level });
  if (logs.length > 300) logs.shift();
  if (level === 'error' || level === 'warn') lastProblem = Date.now();
  renderLog();
}
const two = n => String(n).padStart(2, '0');
function renderLog() {
  if (!$('sheet').classList.contains('open')) return;
  $('logbox').innerHTML = logs.slice().reverse().map(e =>
    `<div class="ln ${e.level}"><time>${two(e.t.getHours())}:${two(e.t.getMinutes())}:${two(e.t.getSeconds())}</time><span>${e.text.replace(/</g, '&lt;')}</span></div>`).join('') || '<div class="ln">Пока пусто</div>';
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.k); toast.k = setTimeout(() => t.classList.remove('show'), 1400);
}

/* ============ Bluetooth ============ */
let device = null, ch = null, connecting = false, userClosed = false, retries = 0, queue = Promise.resolve();
let robotTalks = false, rxBuf = '', pongWaiter = null;
let writesOk = 0, writesFail = 0, lastOk = 0, failStreak = 0, connectedAt = 0;

// Имя как в рекламе модуля: otabek — этот робот, alibek показываем как «Алибек»
function robotName(n) {
  const l = (n || '').toLowerCase();
  if (l.includes('otabek')) return 'otabek';
  if (l.includes('alibek')) return 'Алибек';
  return n || 'робот';
}
function setLink(on, name) {
  $('led').classList.toggle('ok', on);
  $('chipname').textContent = on ? `${robotName(name)} • подключён` : 'Нет связи — подключить';
  $('offline').classList.toggle('hide', on);
  $('diagbtn').classList.toggle('bad', !on);
}
function sendBytes(bytes) {
  if (!ch) return;
  const data = new Uint8Array(bytes);
  queue = queue.then(() => ch && (ch.writeValueWithoutResponse ? ch.writeValueWithoutResponse(data) : ch.writeValue(data)))
    .then(() => { writesOk++; lastOk = Date.now(); if (failStreak) { log(`Команды снова проходят (ошибок подряд было: ${failStreak})`, 'ok'); failStreak = 0; } })
    .catch(e => { writesFail++; failStreak++; if (failStreak === 1 || failStreak % 25 === 0) log('Команда не ушла в Bluetooth: ' + (e.message || e), 'error'); });
}
const sendText = s => sendBytes([...s].map(c => c.charCodeAt(0)));
const sendDrive = (l, r) => sendBytes([0x56, 0x30 + clamp(l, -9, 9) + 9, 0x30 + clamp(r, -9, 9) + 9]);

async function connect(all) {
  if (connecting || !navigator.bluetooth) return;
  connecting = true; userClosed = false;
  try {
    log('Поиск Bluetooth…');
    // по умолчанию показываем только роботов: otabek, alibek, неподписанный HMSoft или любой модуль с каналом FFE0
    device = await navigator.bluetooth.requestDevice(all
      ? { acceptAllDevices: true, optionalServices: [SERVICE] }
      : { filters: [{ namePrefix: 'otabek' }, { namePrefix: 'Otabek' }, { namePrefix: 'OTABEK' }, { namePrefix: 'alibek' },
                    { namePrefix: 'HMSoft' }, { services: [SERVICE] }], optionalServices: [SERVICE] });
    device.addEventListener('gattserverdisconnected', onLost);
    await openGatt();
  } catch (e) {
    if (e.name === 'NotFoundError') log('Устройство не выбрано', 'warn');
    else log('Подключение не удалось: ' + (e.message || e), 'error');
    setLink(false);
  } finally { connecting = false; }
}
async function openGatt() {
  log(`Подключаюсь к ${robotName(device.name)}…`);
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  ch = await svc.getCharacteristic(CHAR);
  writesOk = writesFail = failStreak = 0; connectedAt = Date.now(); robotTalks = false;
  try {
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged', onRobot);
  } catch (e) { log('Канал ответов от робота не включился (это не мешает управлению)'); }
  setLink(true, device.name);
  log(`Подключено: ${robotName(device.name)}, канал FFE1 найден`, 'ok');
  syncRobot();
}
function onRobot(ev) {
  rxBuf += new TextDecoder().decode(ev.target.value);
  let i;
  while ((i = rxBuf.search(/[\r\n]/)) >= 0) {
    const line = rxBuf.slice(0, i).trim(); rxBuf = rxBuf.slice(i + 1);
    if (!line) continue;
    robotTalks = true;
    if (line.startsWith('PONG') && pongWaiter) { pongWaiter(line); pongWaiter = null; }
    else log('Робот прислал: ' + line);
  }
  if (rxBuf.length > 80) rxBuf = '';
}
function onLost() {
  ch = null; stopAll();
  setLink(false);
  if (userClosed) { log('Отключено вручную'); return; }
  const up = connectedAt ? `, держалась ${Math.round((Date.now() - connectedAt) / 1000)} с` : '';
  log(`Bluetooth оборвался${up}. Обычно у робота просело питание или он ушёл из зоны`, 'error');
  if (writesFail) log(`Перед обрывом было ошибок записи: ${writesFail}`, 'warn');
  if (device) setTimeout(retry, 1500);
}
async function retry() {
  if (userClosed || !device || ch) return;
  try { log('Пробую переподключиться…'); await openGatt(); retries = 0; }
  catch (e) {
    if (++retries < 4) setTimeout(retry, 2000);
    else { retries = 0; log('Не получилось переподключиться, нажми «Подключить Bluetooth»', 'error'); }
  }
}
function disconnect() {
  userClosed = true; sendText('S');
  setTimeout(() => { try { device.gatt.disconnect(); } catch (_) {} }, 120);
}
$('connect').onclick = () => connect(false);
$('connectall').onclick = () => connect(true);
$('chip').onclick = () => (ch ? disconnect() : connect());

if (!navigator.bluetooth) {
  const w = $('unsupported'); w.hidden = false;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  w.textContent = ios
    ? 'Safari и Chrome на iPhone не умеют Web Bluetooth. Установи бесплатный браузер Bluefy из App Store и открой в нём эту же страницу (адрес скопируй).'
    : 'Этот браузер не умеет Web Bluetooth. Открой страницу в Chrome или Edge на Android или компьютере.';
  $('connect').style.display = 'none'; $('connectall').style.display = 'none';
  log('Браузер без Web Bluetooth', 'error');
}

/* ============ состояние пульта ============ */
let power = 7, turbo = false, auto = true, face = null, faceLeft = 0, faceTimer = null;
function syncRobot() { sendText(String(power)); sendText(auto ? 'U' : 'X'); }

/* ============ смешивание осей (как в приложении) ============ */
function mixDrive(x, y) {
  const dead = 0.10, m = Math.hypot(x, y);
  if (m < dead) return [0, 0];
  const s = clamp((m - dead) / (1 - dead), 0, 1), k = s / m, sx = x * k, sy = y * k;
  let l = sy + sx, r = sy - sx;
  const mx = Math.max(1, Math.abs(l), Math.abs(r)); l /= mx; r /= mx;
  const q = v => { const a = Math.abs(v); if (a < 0.05) return 0; const c = 0.35 * a + 0.65 * a * a; return Math.sign(v) * clamp(Math.round(c * 9), 1, 9); };
  return [q(l), q(r)];
}

/* ============ джойстик ============ */
const cv = $('stick'), ctx = cv.getContext('2d'), box = $('stickbox');
let size = 200, dpr = 1;
let knob = { x: 0, y: 0 };          // -1..1, y вниз
let from = { x: 0, y: 0 }, backT = 1, backStart = 0;
let ptr = null, jx = 0, jy = 0, active = false, lastL = 99, lastR = 99, lastTx = 0;
const keys = new Set();

function resize() {
  size = Math.max(120, Math.floor(Math.min(box.clientWidth, box.clientHeight)));
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = cv.style.height = size + 'px';
  cv.width = cv.height = Math.round(size * dpr);
  draw();
}
new ResizeObserver(resize).observe(box);

const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mixColor(a, b, t) { return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`; }

function draw() {
  const c = ctx; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2, r = size / 2;
  const power01 = clamp(Math.hypot(knob.x, knob.y), 0, 1);

  // основание
  let g = c.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, '#16213A'); g.addColorStop(1, '#0B1222');
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r * .98, 0, 7); c.fill();
  c.lineWidth = 2; c.strokeStyle = `rgba(${Math.round(lerp(255, 25, power01 * .9))},${Math.round(lerp(255, 227, power01 * .9))},${Math.round(lerp(255, 140, power01 * .9))},${lerp(.14, 1, power01 * .9)})`;
  c.beginPath(); c.arc(cx, cy, r * .98, 0, 7); c.stroke();
  c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,.14)';
  c.beginPath(); c.arc(cx, cy, r * .64, 0, 7); c.stroke();

  // стрелки направлений
  c.strokeStyle = 'rgba(138,153,181,.55)'; c.lineWidth = 3; c.lineCap = 'round'; c.lineJoin = 'round';
  for (let i = 0; i < 4; i++) {
    c.save(); c.translate(cx, cy); c.rotate(i * Math.PI / 2);
    const y = -r * .84; c.beginPath();
    c.moveTo(-r * .07, y + r * .045); c.lineTo(0, y - r * .025); c.lineTo(r * .07, y + r * .045); c.stroke(); c.restore();
  }

  const kx = cx + knob.x * r * .64, ky = cy + knob.y * r * .64, kr = r * .30;

  // светящийся след
  if (power01 > .02) {
    c.save(); c.shadowColor = `rgba(25,227,140,${.35 + .4 * power01})`; c.shadowBlur = (14 + 14 * power01) * 1;
    c.strokeStyle = `rgba(25,227,140,${.10 + .25 * power01})`; c.lineWidth = 10 + 10 * power01; c.lineCap = 'round';
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(kx, ky); c.stroke(); c.restore();
  }
  // тень и свечение рычага
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 16; c.shadowOffsetY = 6; c.fillStyle = '#0B1222';
  c.beginPath(); c.arc(kx, ky, kr, 0, 7); c.fill(); c.restore();
  c.save(); c.shadowColor = `rgba(25,227,140,${.25 + .55 * power01})`; c.shadowBlur = 20 + 16 * power01; c.fillStyle = `rgba(25,227,140,${.12 + .38 * power01})`;
  c.beginPath(); c.arc(kx, ky, kr * 1.05, 0, 7); c.fill(); c.restore();
  // рычаг
  g = c.createRadialGradient(kx - kr * .35, ky - kr * .4, 0, kx, ky, kr * 1.1);
  g.addColorStop(0, mixColor([58, 74, 110], [124, 245, 196], power01));
  g.addColorStop(1, mixColor([27, 39, 68], [25, 227, 140], power01 * .85));
  c.fillStyle = g; c.beginPath(); c.arc(kx, ky, kr, 0, 7); c.fill();
  c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.18)'; c.stroke();
  c.fillStyle = `rgba(255,255,255,${.22 + .3 * power01})`; c.beginPath(); c.arc(kx, ky, kr * .28, 0, 7); c.fill();
}

function animBack(now) {
  if (backT >= 1) return;
  backT = clamp((now - backStart) / 220, 0, 1);
  const e = easeOutBack(backT);
  knob = { x: lerp(from.x, 0, e), y: lerp(from.y, 0, e) };
  draw();
  requestAnimationFrame(animBack);
}
function releaseStick() {
  ptr = null; from = { ...knob }; backT = 0; backStart = performance.now();
  requestAnimationFrame(animBack);
  stopDrive();
}
function stickAt(e) {
  const b = cv.getBoundingClientRect(), travel = size * .32;
  let vx = (e.clientX - (b.left + size / 2)) / travel, vy = (e.clientY - (b.top + size / 2)) / travel;
  const d = Math.hypot(vx, vy); if (d > 1) { vx /= d; vy /= d; }
  knob = { x: vx, y: vy }; jx = vx; jy = -vy; active = true; draw();
}
cv.addEventListener('pointerdown', e => {
  if (ptr !== null) return; ptr = e.pointerId; cv.setPointerCapture(ptr); backT = 1; buzz(8); stickAt(e); e.preventDefault();
});
cv.addEventListener('pointermove', e => { if (e.pointerId === ptr) stickAt(e); });
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, e => { if (e.pointerId === ptr) releaseStick(); }));

// отправка каждые 40 мс, как в приложении: при изменении или раз в 180 мс
setInterval(() => {
  if (!ch || !active) return;
  const [l, r] = mixDrive(jx, jy), now = performance.now();
  if (l !== lastL || r !== lastR || now - lastTx > 180) {
    if (!l && !r) sendText('S'); else sendDrive(l, r);
    lastL = l; lastR = r; lastTx = now;
  }
}, 40);

function stopDrive() { active = false; jx = jy = 0; lastL = lastR = 99; sendText('S'); setTimeout(() => sendText('S'), 70); }
function stopAll() { keys.clear(); ptr = null; stopDrive(); knob = { x: 0, y: 0 }; draw(); }

// клавиатура для компьютера
const KM = { w: [0, 1], arrowup: [0, 1], s: [0, -1], arrowdown: [0, -1], a: [-1, 0], arrowleft: [-1, 0], d: [1, 0], arrowright: [1, 0] };
function keyDrive() {
  let x = 0, y = 0; keys.forEach(k => { x += KM[k][0]; y += KM[k][1]; });
  const d = Math.hypot(x, y) || 1; jx = x / d; jy = y / d; knob = { x: jx, y: -jy }; active = true; draw();
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); stopAll(); return; }
  if (!KM[k] || e.repeat) return; e.preventDefault(); keys.add(k); keyDrive();
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase(); if (!KM[k]) return; keys.delete(k);
  if (keys.size) keyDrive(); else { knob = { x: 0, y: 0 }; draw(); stopDrive(); }
});
addEventListener('blur', () => { if (ch) stopAll(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && ch) stopAll(); });

/* ============ мощность ============ */
const bar = $('bar'), segs = [];
for (let i = 9; i >= 1; i--) { const s = document.createElement('div'); s.className = 'seg'; segs[i] = s; bar.appendChild(s); }
function paintPower() {
  const v = turbo ? 9 : power;
  $('pnum').textContent = v; $('pnum').classList.toggle('turbo', turbo);
  for (let i = 1; i <= 9; i++) {
    const t = (i - 1) / 8, col = `rgb(${Math.round(lerp(25, 255, t))},${Math.round(lerp(227, 176, t))},${Math.round(lerp(140, 32, t))})`;
    segs[i].style.background = i <= v ? col : '';
    segs[i].style.boxShadow = i === v ? `0 0 12px ${col}` : 'none';
  }
}
function pickPower(e) {
  const b = bar.getBoundingClientRect(), t = 1 - clamp((e.clientY - b.top) / b.height, 0, 1);
  const v = clamp(Math.round(1 + t * 8), 1, 9);
  if (v !== power) { power = v; buzz(5); paintPower(); if (!turbo) sendText(String(v)); }
}
let barPtr = null;
bar.addEventListener('pointerdown', e => { barPtr = e.pointerId; bar.setPointerCapture(barPtr); pickPower(e); });
bar.addEventListener('pointermove', e => { if (e.pointerId === barPtr) pickPower(e); });
['pointerup', 'pointercancel'].forEach(t => bar.addEventListener(t, () => { barPtr = null; }));
paintPower();

/* ============ кнопки с «держи» ============ */
function hold(el, down, up) {
  let id = null;
  el.addEventListener('pointerdown', e => { if (id !== null) return; id = e.pointerId; el.setPointerCapture(id); el.classList.add('down'); buzz(8); down && down(); e.preventDefault(); });
  const end = e => { if (e.pointerId !== id) return; id = null; el.classList.remove('down'); up && up(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
hold($('turbo'), () => { turbo = true; paintPower(); sendText('9'); }, () => { turbo = false; paintPower(); sendText(String(power)); });
hold($('stop'), () => { stopAll(); });

/* ============ лица ============ */
const ICON = {
  N: '<circle cx="12" cy="12" r="9"/><path d="M8.5 10h.01M15.5 10h.01M9 15h6"/>',
  H: '<circle cx="12" cy="12" r="9"/><path d="M8.5 10h.01M15.5 10h.01M8 14c1 2.6 7 2.6 8 0"/>',
  A: '<circle cx="12" cy="12" r="9"/><path d="M7.5 8.5l3 1.5M16.5 8.5l-3 1.5M8.5 16c1.2-1.6 5.8-1.6 7 0"/>',
  D: '<path d="M12 3c1 3 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 .2 1 .8 1.7 1.5 2C10.5 8 11 5 12 3z"/>',
  Z: '<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
  AUTO: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>'
};
const FACES = [['N', 'Обычное лицо'], ['H', 'Улыбка'], ['A', 'Злость'], ['D', 'Чёртик'], ['Z', 'Сон']];
const faces = $('faces'), faceBtn = {};
const mk = (cls, svgPath, cap, label) => {
  const b = document.createElement('button'); b.className = 'pad ' + cls; b.setAttribute('aria-label', label);
  b.innerHTML = `<div class="in"><svg width="26" height="26" viewBox="0 0 24 24">${svgPath}</svg><span class="cap" ${cap ? '' : 'hidden'}>${cap || ''}</span></div>`;
  return b;
};
const autoBtn = mk('amber on', ICON.AUTO, 'АВТО', 'Авто-настроение');
autoBtn.querySelector('svg').setAttribute('width', 24);
faces.appendChild(autoBtn);
FACES.forEach(([cmd, label]) => {
  const b = mk('', ICON[cmd], '', label); b.querySelector('.cap').className = 'cnt'; faceBtn[cmd] = b; faces.appendChild(b);
  hold(b, () => setFace(cmd));
});
hold(autoBtn, () => {
  auto = !auto; autoBtn.classList.toggle('on', auto); sendText(auto ? 'U' : 'X');
  log(auto ? 'Настроение: авто (по движению)' : 'Настроение: само меняется');
});
function setFace(cmd) {
  sendText(cmd); clearInterval(faceTimer); face = cmd; faceLeft = 15; paintFaces();
  faceTimer = setInterval(() => { if (--faceLeft <= 0) { clearInterval(faceTimer); face = null; } paintFaces(); }, 1000);
}
function paintFaces() {
  for (const k in faceBtn) {
    const on = face === k, b = faceBtn[k], cap = b.querySelector('.cnt');
    b.classList.toggle('on', on); cap.hidden = !on; cap.textContent = faceLeft + ' с';
  }
}

/* ============ ушки ============ */
let earTimer = null, earManual = false, earRelease = null;
function paintRange(el) { el.style.setProperty('--p', (el.value / 180 * 100) + '%'); }
function sendEars() {
  const l = +$('earL').value, r = +$('earR').value;
  sendBytes([0x45, 0x30 + Math.round(l / 2), 0x30 + Math.round(r / 2)]);
}
['earL', 'earR'].forEach(id => {
  const el = $(id); paintRange(el);
  el.addEventListener('input', () => {
    paintRange(el); setEarManual(true);
    clearTimeout(earTimer); earTimer = setTimeout(sendEars, 30);
  });
});
function setEarManual(m) {
  earManual = m; $('earAuto').classList.toggle('on', !m);
  clearTimeout(earRelease);
  if (m) earRelease = setTimeout(() => setEarManual(false), 8000);
  $('earCap').textContent = m ? 'АВТО?' : 'АВТО';
}
hold($('earAuto'), () => { sendText('C'); setEarManual(false); log('Ушки снова сами'); });

/* ============ диагностика ============ */
function rowsHtml() {
  const bt = !!navigator.bluetooth, up = ch ? Math.round((Date.now() - connectedAt) / 1000) : 0;
  const R = (name, val, st) => `<div class="r ${st}"><i></i><div><small>${name}</small><b>${val}</b></div></div>`;
  return [
    R('Bluetooth браузера', bt ? 'доступен' : 'НЕТ (нужен Chrome или Edge)', bt ? 'ok' : 'bad'),
    R('Связь с модулем', ch ? `подключено, ${up} с` : (connecting ? 'подключаюсь…' : 'нет связи'), ch ? 'ok' : 'bad'),
    R('Команды', ch ? `ушло ${writesOk}, ошибок ${writesFail}<br>последняя: ${lastOk ? Math.max(0, Math.round((Date.now() - lastOk) / 1000)) + ' с назад' : 'ещё не было'}` : '—', !ch ? '' : (writesFail ? 'warn' : 'ok')),
    R('Ответ робота', robotTalks ? 'робот отвечает (линия D3 → модуль работает)' : 'пока не отвечал, нажми «Проверка Bluetooth»', robotTalks ? 'ok' : ''),
    R('Совет', !ch ? 'Проверь тумблер и заряд аккумуляторов, потом подключись заново.' : (writesFail ? 'Часть команд не уходит, подойди ближе к роботу.' : 'Телефон → модуль работает. Если робот стоит, проверь питание L298N и провода ENA/ENB/IN1–IN4.'), '')
  ].join('');
}
function ping(ms) {
  return new Promise(res => {
    const t0 = performance.now();
    const timer = setTimeout(() => { pongWaiter = null; res(null); }, ms);
    pongWaiter = () => { clearTimeout(timer); res(Math.round(performance.now() - t0)); };
    sendText('T');
  });
}
let testing = false;
async function runTest() {
  if (testing) return; testing = true; $('testbt').disabled = true;
  log('— Проверка Bluetooth —');
  try {
    if (!navigator.bluetooth) { log('Браузер без Web Bluetooth. Нужен Chrome или Edge.', 'error'); return; }
    if (!ch) { log('Нет подключения к роботу. Закрой окно и нажми «Подключить Bluetooth».', 'error'); return; }
    log(`Связь есть: ${robotName(device && device.name)}`, 'ok');
    stopDrive();
    const times = [];
    for (let i = 0; i < 5; i++) { const t = await ping(1500); if (t !== null) times.push(t); await new Promise(r => setTimeout(r, 150)); }
    if (times.length === 5) log(`Туда и обратно работает: 5 из 5, ответ ${Math.min(...times)}–${Math.max(...times)} мс`, 'ok');
    else if (times.length) log(`Ответов ${times.length} из 5: связь нестабильная (слабый сигнал или питание модуля)`, 'warn');
    else {
      log('Робот не ответил ни разу. Команды до Arduino могут доходить, но обратный путь молчит:', 'error');
      log('• проверь провод RXD модуля → D3 (через делитель 1к + 2к) и питание модуля 5V', 'warn');
      log('• старая прошивка без ответа PONG: залей текущий robot_druga.ino', 'warn');
    }
    sendText('P');
    log('Робот должен пикнуть: если пикнул, команды до Arduino доходят', 'info');
  } finally { testing = false; $('testbt').disabled = false; }
}
$('testbt').onclick = runTest;
function refreshSheet() { if ($('sheet').classList.contains('open')) { $('rowlist').innerHTML = rowsHtml(); renderLog(); } }
setInterval(refreshSheet, 800);
setInterval(() => { $('diagbtn').classList.toggle('bad', !ch || Date.now() - lastProblem < 20000); }, 1000);
$('diagbtn').onclick = () => { stopAll(); $('sheet').classList.add('open'); refreshSheet(); };
$('diagback').onclick = () => $('sheet').classList.remove('open');
$('clearlog').onclick = () => { logs.length = 0; renderLog(); };
$('copylog').onclick = async () => {
  const txt = logs.map(e => `${e.t.toLocaleTimeString('ru-RU')} ${e.text}`).join('\n');
  try { await navigator.clipboard.writeText(txt); toast('Журнал скопирован'); } catch (_) { toast('Не удалось скопировать'); }
};

/* ============ экран не гаснет ============ */
let wl = null;
async function keepAwake() { try { if (navigator.wakeLock && !document.hidden) wl = await navigator.wakeLock.request('screen'); } catch (_) {} }
document.addEventListener('visibilitychange', keepAwake); keepAwake();

addEventListener('contextmenu', e => e.preventDefault());
log('Нажми «Подключить Bluetooth» и выбери робота');
</script>
</body>
</html>
